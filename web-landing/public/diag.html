<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Drayvo viewport diagnostic</title>
<style>
  /* Deliberately mirrors the real page's setup so the test is representative:
     same body overflow treatment, same two fixed bars, same z-index ordering. */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; max-width: 100%; }
  body {
    overflow-x: hidden;
    background: #060d1a;
    color: #edf1f7;
    font: 500 15px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @supports (overflow: clip) { body { overflow-x: clip; } }

  /* THE EXPERIMENT.
     Two fixed bars, both `top: 0`, identical in every respect except that the
     left one has `backdrop-filter` and the right one does not. WebKit promotes
     a backdrop-filtered element to its own compositing layer; if that layer is
     what gets mispositioned in this webview, these two halves will render at
     different heights on screen. Same layout, same coordinates - so any visible
     difference is compositing, and names the culprit in one screenshot. */
  #topbar, #topbar2 {
    position: fixed; top: 0;
    height: 56px; z-index: 1100;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px; text-align: center;
    border-bottom: 1px solid rgb(255 255 255 / 0.14);
  }
  #topbar {
    left: 0; width: 50%;
    background: rgb(6 13 26 / 0.88);
    backdrop-filter: saturate(160%) blur(14px);
    -webkit-backdrop-filter: saturate(160%) blur(14px);
    border-right: 2px solid #ff6600;
  }
  /* Same colour, no blur - opaque so it cannot be confused with the page. */
  #topbar2 { left: 50%; width: 50%; background: #060d1a; }
  /* Mimics the mobile action bar: fixed, bottom:0, opaque, orange button. */
  #bottombar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 1100;
    padding: 12px; background: #0e141f;
    border-top: 1px solid rgb(255 255 255 / 0.14);
  }
  #bottombar b {
    display: block; text-align: center; padding: 14px;
    border-radius: 6px; background: #c23700; color: #fff;
  }

  .pad { height: 56px; }
  .panel {
    margin: 16px 12px; padding: 14px;
    border: 1px solid rgb(255 255 255 / 0.18); border-radius: 8px;
    background: #0e141f; white-space: pre-wrap; word-break: break-word;
  }
  .panel h2 { margin: 0 0 10px; font-size: 14px; color: #ff7e23; letter-spacing: .12em; }
  .spacer { height: 150vh; display: grid; place-items: center; color: #7c8da8; }
  .bad { color: #ff6b6b; }
  .good { color: #4ade80; }
</style>
</head>
<body>

<div id="topbar">A: blur<br>(like header)</div>
<div id="topbar2">B: no blur</div>
<div class="pad"></div>

<div class="panel"><h2>READ THIS PANEL</h2>Scroll down a little, then screenshot the whole screen.
Repeat once more further down the page.</div>

<div class="panel" id="out1"><h2>LIVE VALUES</h2>…</div>

<div class="spacer">— keep scrolling —</div>
<div class="panel" id="out2"><h2>LIVE VALUES (mid-page)</h2>…</div>
<div class="spacer">— keep scrolling —</div>
<div class="panel" id="out3"><h2>LIVE VALUES (lower)</h2>…</div>
<div class="spacer" style="height:60vh">— end —</div>

<div id="bottombar"><b>FIXED bottom:0 (acts as the action bar)</b></div>

<script>
(function () {
  var probe = document.createElement('div');
  probe.style.cssText =
    'position:fixed;top:0;left:0;width:0;height:0;' +
    'padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);' +
    'padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);';
  document.body.appendChild(probe);

  var top = document.getElementById('topbar');
  var bot = document.getElementById('bottombar');
  var outs = [document.getElementById('out1'), document.getElementById('out2'), document.getElementById('out3')];
  var anomalies = [];

  function n(v) { return Math.round(v * 10) / 10; }

  function read() {
    var vv = window.visualViewport;
    var cs = getComputedStyle(probe);
    var tr = top.getBoundingClientRect();
    var t2r = document.getElementById('topbar2').getBoundingClientRect();
    var br = bot.getBoundingClientRect();

    // The two numbers that matter: a correct fixed top bar sits at 0, and a
    // correct fixed bottom bar ends exactly at the visible viewport bottom.
    var topOff = n(tr.top);
    var botGap = n((vv ? vv.height : window.innerHeight) - br.bottom);

    if (topOff !== 0 && anomalies.length < 6) {
      anomalies.push('scrollY=' + n(window.scrollY) + ' topbar.top=' + topOff);
    }

    return [
      'UA: ' + navigator.userAgent,
      '',
      'A (blur)    rect.top = ' + topOff,
      'B (no blur) rect.top = ' + n(t2r.top),
      'A vs B delta         = ' + n(tr.top - t2r.top) + '   (layout says they are identical)',
      '>> LOOK AT THE SCREEN: are bars A and B at the SAME height?',
      'bottombar bottom vs viewport      = ' + botGap + (Math.abs(botGap) < 1 ? '   OK' : '   <-- SHOULD BE 0'),
      '',
      'window.innerWidth/Height  = ' + window.innerWidth + ' x ' + window.innerHeight,
      'documentElement.client    = ' + document.documentElement.clientWidth + ' x ' + document.documentElement.clientHeight,
      'window.scrollY            = ' + n(window.scrollY),
      'scrollingElement          = ' + (document.scrollingElement === document.documentElement ? 'html' : (document.scrollingElement === document.body ? 'body' : String(document.scrollingElement))),
      '',
      'visualViewport            = ' + (vv
        ? n(vv.width) + ' x ' + n(vv.height) + '  offsetTop=' + n(vv.offsetTop) + '  offsetLeft=' + n(vv.offsetLeft) + '  pageTop=' + n(vv.pageTop) + '  scale=' + n(vv.scale)
        : 'not supported'),
      '',
      'safe-area insets  top/bottom/left/right = ' +
        cs.paddingTop + ' / ' + cs.paddingBottom + ' / ' + cs.paddingLeft + ' / ' + cs.paddingRight,
      '',
      'topbar rect   = top ' + n(tr.top) + '  bottom ' + n(tr.bottom) + '  height ' + n(tr.height),
      'bottombar rect= top ' + n(br.top) + '  bottom ' + n(br.bottom) + '  height ' + n(br.height),
      '',
      'anomalies seen while scrolling:',
      anomalies.length ? anomalies.join('\n') : '  (none yet)'
    ].join('\n');
  }

  function paint() {
    var text = read();
    for (var i = 0; i < outs.length; i++) {
      var h = outs[i].querySelector('h2');
      outs[i].textContent = text;
      outs[i].insertBefore(h, outs[i].firstChild);
    }
  }

  paint();
  addEventListener('scroll', paint, { passive: true });
  addEventListener('resize', paint);
  if (window.visualViewport) {
    visualViewport.addEventListener('scroll', paint);
    visualViewport.addEventListener('resize', paint);
  }
  setInterval(paint, 400);
})();
</script>
</body>
</html>
